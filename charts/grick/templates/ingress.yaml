{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "grick.fullname" . }}
  labels:
    {{- include "grick.labels" . | nindent 4 }}
  {{- /* A null value unsets an annotation (Helm's way to remove a key), so it is not rendered. */}}
  {{- $annotations := dict }}
  {{- range $key, $value := .Values.ingress.annotations }}
  {{- if not (kindIs "invalid" $value) }}
  {{- $_ := set $annotations $key $value }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "grick.fullname" $ }}-web
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
