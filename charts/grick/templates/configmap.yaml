{{- include "grick.storage.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grick.fullname" . }}-config
  labels:
    {{- include "grick.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- with include "grick.storage.configData" . }}{{ . | trim | nindent 2 }}{{ end }}
  {{- with .Values.platformHostEmails }}
  GRICK_PLATFORM_HOST_EMAILS: {{ . | quote }}
  {{- end }}
