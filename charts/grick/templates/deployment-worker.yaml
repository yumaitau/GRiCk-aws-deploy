{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grick.fullname" . }}-worker
  labels:
    {{- include "grick.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "grick.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "grick.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        {{- include "grick.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "grick.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.worker.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "grick.fullname" . }}-config
            - secretRef:
                name: {{ include "grick.secretName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $skipMigrate := and .Values.migration.enabled .Values.migration.asHelmHook }}
          {{- if or .Values.extraEnv $skipMigrate }}
          env:
            {{- if $skipMigrate }}
            # The pre-install/pre-upgrade migration hook has already migrated.
            - name: SKIP_DB_MIGRATE
              value: "1"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # The worker refreshes /tmp/grick-worker-heartbeat every 30 s after Redis
          # answers PING (lib/jobs/worker-heartbeat.ts). A stale or missing file
          # means Redis is unreachable or the event loop is stuck. The startup
          # probe covers the entrypoint's database wait and migration.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/grick-worker-heartbeat) )) -lt 120
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/grick-worker-heartbeat) )) -lt 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- $evidenceMount := include "grick.storage.volumeMount" . }}
          {{- if or .Values.securityContext.readOnlyRootFilesystem $evidenceMount }}
          volumeMounts:
            {{- if .Values.securityContext.readOnlyRootFilesystem }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- with $evidenceMount }}{{ . | trim | nindent 12 }}{{ end }}
          {{- end }}
      {{- $evidenceVolume := include "grick.storage.volume" . }}
      {{- if or .Values.securityContext.readOnlyRootFilesystem $evidenceVolume }}
      volumes:
        {{- if .Values.securityContext.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- with $evidenceVolume }}{{ . | trim | nindent 8 }}{{ end }}
      {{- end }}
{{- end }}
